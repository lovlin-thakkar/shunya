[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shunya-cli"
version = "0.2.0"
description = "CLI for the Shunya voice agent QA platform"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "typer>=0.12", "rich>=13"]

[project.scripts]
shunya = "cli.main:main"

[tool.setuptools]
packages = ["cli"]

[tool.setuptools.package-dir]
"cli" = "."
