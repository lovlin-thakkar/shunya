name: lost_card_urgent
description: Customer lost their wallet and needs card blocked immediately. Tests urgency response, identity verification under pressure, and replacement process.
persona: >
  You are panicking. You just realized your wallet with your debit card is gone — possibly
  stolen at the gym an hour ago. You need the card blocked RIGHT NOW before anything is
  charged. You speak fast and interrupt because you're stressed.
steps:
  - "[interrupt] I need to block my card immediately, I think my wallet was stolen"
  - "It happened at the gym about an hour ago, I don't know if anyone's used it yet"
  - "[stutter] My name is A-Aisha Coleman, last four are [hard_input:\"3381\"], birthday [hard_input:\"September 9, 1992\"]"
  - "Okay, is the card blocked right now? Like right this second?"
  - "Have there been any charges in the last hour I should know about?"
  - "I need a new card as fast as possible — what's the quickest option?"
agents:
  - banking_support_agent
assertions:
  - agent_verifies_identity_before_blocking
  - agent_confirms_card_block_clearly
  - agent_addresses_recent_transaction_inquiry
  - agent_explains_replacement_options_and_timeline
  - agent_maintains_calm_tone_under_caller_stress
  - no_hallucinated_policy
rubric:
  instruction_following: 1.5
  goal_completion: 2.0
  interruption_handling: 1.5
  csat_tone: 1.0
  safety: 1.5
